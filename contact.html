<section class="contact">

    <h2>Contact Us</h2>

    <form id="contactForm">

        <label>Name</label>
        <input type="text" id="contactName" required>

        <label>Email</label>
        <input type="email" id="contactEmail" required>

        <label>Message</label>
        <textarea id="contactMessage" required></textarea>

        <button type="submit">Send Message</button>

    </form>
